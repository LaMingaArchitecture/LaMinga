version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Minor/patch bumps land as one PR per dependency type; majors stay
    # individual so each breaking change gets its own review.
    groups:
      production:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      development:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns: ['*']
