# L'outil photo Windows du kit Claude ne peut pas être testé sur Mac : on le fait tourner sur un
# runner Windows à chaque modification.
name: Outil photo Windows

on:
  pull_request:
    paths:
      - docs/guide-utilisateur/kit-claude/outils/optimiser-photos.ps1
      - docs/guide-utilisateur/tests-outil-photo/**
      - .github/workflows/outil-photo-windows.yml
  push:
    branches: [main]
    paths:
      - docs/guide-utilisateur/kit-claude/outils/optimiser-photos.ps1
      - docs/guide-utilisateur/tests-outil-photo/**

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tester avec Windows PowerShell 5.1 (celui des postes de l'agence)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File docs/guide-utilisateur/tests-outil-photo/test.ps1
      - name: Tester l'installation du raccourci
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File docs/guide-utilisateur/kit-claude/outils/optimiser-photos.ps1 -Installer
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Optimiser pour le web.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) { throw 'Raccourci absent du bureau' }
          if (-not (Test-Path -LiteralPath "$env:LOCALAPPDATA\LaMinga\optimiser-photos.ps1")) { throw 'Outil non copié' }
