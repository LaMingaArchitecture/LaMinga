<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: #ecebe8;
        font:
          13px -apple-system,
          'Helvetica Neue',
          sans-serif;
        color: #1d1d1f;
      }
      .dialog {
        width: 380px;
        margin: 20px;
        background: #f6f6f6;
        border-radius: 12px;
        padding: 20px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.25),
          0 0 0 0.5px rgba(0, 0, 0, 0.2);
      }
      .title {
        font-weight: 700;
        text-align: center;
        margin-bottom: 10px;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 12px;
        border-radius: 12px;
        background: #ff6c4f;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
        font-size: 22px;
      }
      p {
        margin: 0 0 6px;
        text-align: center;
        line-height: 1.4;
      }
      .warn {
        color: #6b4a00;
      }
      button {
        display: block;
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 6px;
        padding: 7px;
        background: #0a7cff;
        color: #fff;
        font: inherit;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="dialog">
      <div class="icon">web</div>
      <div class="title">Optimiser pour le web — LaMinga</div>
      <p>14 image(s) prête(s) dans les dossiers « web ».</p>
      <p class="warn">⚠ Trop petite (900×600), floue en plein écran : capture-chantier.png</p>
      <button>OK</button>
    </div>
  </body>
</html>
